# Railway deployment manifest — single "web" service (wiki explorer UI).
#
# NOTE: railway.toml configures exactly ONE Railway service. The poller and
# dashboard are NOT deployed by this file. They share the agent SQLite DB with
# each other, which Railway services cannot do (one Volume per service), so
# they will be deployed later either as a single combined service on a Volume
# or after migrating the DB layer to Railway Postgres. See CLAUDE.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Wrapped in `sh -c` so ${PORT} is expanded by a shell. Railway executes the
# raw startCommand without a shell, so a bare `$PORT` would be passed to uvicorn
# literally (uvicorn then errors: "'$PORT' is not a valid integer"). PORT
# defaults to 8000 (set via Dockerfile ENV / EXPOSE) when Railway doesn't inject one.
startCommand = "sh -c 'uvicorn server.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
