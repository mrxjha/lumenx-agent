# Railway deployment manifest.
#
# This repo deploys as THREE services off one Docker image (web, dashboard,
# poller) plus a managed Postgres database. Each service runs the same image
# and selects its behavior via the SERVICE_ROLE env var (see entrypoint.sh):
#
#   SERVICE_ROLE=web        uvicorn wiki explorer        (public)
#   SERVICE_ROLE=dashboard  streamlit review + cost UI   (public)
#   SERVICE_ROLE=poller     background auto-reply loop   (no public port)
#
# All three share state through DATABASE_URL (Postgres), so poller-generated
# drafts appear in the dashboard's review queue.
#
# No startCommand is set here on purpose: the Dockerfile CMD runs entrypoint.sh,
# which dispatches on SERVICE_ROLE. That keeps a single railway.toml valid for
# every service (railway.toml can only describe one service's start command).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Explicitly run the role dispatcher. Setting startCommand here (rather than
# relying on the Dockerfile CMD) is deliberate: Railway caches a service-level
# start command from earlier deploys, and only a value present in railway.toml
# reliably overrides it. entrypoint.sh then dispatches on SERVICE_ROLE.
startCommand = "sh /app/entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
